<head>
	<title>Open Pediatrics</title>

<body>

<div id="preloader">
	<img class="logo" src="{% static 'images/logo1.png' %}" alt="Logo" width="119" height="58">
	<div id="status"><span></span><span></span></div>
</div>

<div class="login-wrapper" id="login-content">
	<div class="login-content">
		<a href="#" class="close">x</a>
		<h3>Login</h3>
		<form method="post" action="#">
			<div class="row">
				<label for="username">Username
					<input type="text" id="username" name="username" placeholder="Hugh Jackman"
						pattern="^[a-zA-Z][a-zA-Z0-9-_\.]{8,20}$" required>
				</label>
			</div>
			<div class="row">
				<label for="password">Password
					<input type="password" id="password" name="password" placeholder="******"
						pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required>
				</label>
			</div>
			<div class="row remember">
				<div><input type="checkbox" name="remember" value="Remember me"><span>Remember me</span></div>
				<a href="#">Forgot password?</a>
			</div>
			<div class="row"><button type="submit">Login</button></div>
		</form>
		<div class="row">
			<p>Or via social</p>
			<div class="social-btn-2">
				<a class="fb" href="#"><i class="ion-social-facebook"></i>Facebook</a>
				<a class="tw" href="#"><i class="ion-social-twitter"></i>Twitter</a>
			</div>
		</div>
	</div>
</div>

<div class="login-wrapper" id="signup-content">
	<div class="login-content">
		<a href="#" class="close">x</a>
		<h3>Sign Up</h3>
		<form method="post" action="#">
			<div class="row">
				<label for="username-2">Username
					<input type="text" id="username-2" name="username" placeholder="Hugh Jackman"
						pattern="^[a-zA-Z][a-zA-Z0-9-_\.]{8,20}$" required>
				</label>
			</div>
			<div class="row">
				<label for="email-2">Email
					<input type="password" id="email-2" name="email"
						pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required>
				</label>
			</div>
			<div class="row">
				<label for="password-2">Password
					<input type="password" id="password-2" name="password"
						pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required>
				</label>
			</div>
			<div class="row">
				<label for="repassword-2">Re-type Password
					<input type="password" id="repassword-2" name="password"
						pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required>
				</label>
			</div>
			<div class="row"><button type="submit">Sign Up</button></div>
		</form>
	</div>
</div>

<div class="landing-hero">
	<img src="{% static 'images/logo1.png' %}" alt="Logo">

</div>

		</div>
		<div class="col-md-6">
			<img src="{% static 'images/uploads/landing-light-version.png' %}" alt="Light Version">

			<a href="index_light.html" target="_blank" class="redbtn">SEE DEMO</a>

</div>

<div class="ft-copyright-landing">

</div>

<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/plugins.js' %}"></script>

<script src="{% static 'js/custom.js' %}"></script>
