<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="{% url 'send_otp' %}" method="post">
        {% csrf_token %}
        <label for=""> Email ID :</label>
        <input type="email" name="email" id="" placeholder="Email id ">
        <button type="submit">Send OTP</button>
        {% if messages %}
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
        {% endif %}
    </form>

<!-- Login Modal -->
<div id="loginModal" class="modal fade" role="dialog">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title">Login</h4>
			</div>
			<form method="POST" action="{% url 'login_view' %}">
				{% csrf_token %}
				<div class="modal-body">
					<div class="form-group">
						<label for="login_email">Email Address</label>
						<input type="email" class="form-control" id="login_email" name="email" required>
					</div>
					<div class="form-group">
						<label for="login_password">Password</label>
						<input type="password" class="form-control" id="login_password" name="password" required>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary">Login</button>
				</div>
			</form>
			<div class="modal-body text-center" style="padding-top: 0;">
				<p>Don't have an account? <a href="#" data-dismiss="modal" data-toggle="modal" data-target="#signupModal">Sign up here</a></p>
			</div>
		</div>
	</div>
</div>

<!-- Signup Modal -->
<div id="signupModal" class="modal fade" role="dialog">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title">Sign Up</h4>
			</div>
			<form method="POST" action="{% url 'register_view' %}">
				{% csrf_token %}
				<div class="modal-body">
					<div class="form-group">
						<label for="username">username</label>
						<input type="text" class="form-control" id="username" name="username" required>
					</div>
					<div class="form-group">
						<label for="signup_first_name">First Name</label>
						<input type="text" class="form-control" id="signup_first_name" name="first_name" required>
					</div>
					<div class="form-group">
						<label for="signup_last_name">Last Name</label>
						<input type="text" class="form-control" id="signup_last_name" name="last_name">
					</div>
					<div class="form-group">
						<label for="signup_email">Email Address</label>
						<input type="email" class="form-control" id="signup_email" name="email" required>
					</div>
					<div class="form-group">
						<label for="signup_phone">Phone Number</label>
						<input type="tel" class="form-control" id="signup_phone" name="phone_number">
					</div>
					<div class="form-group">
						<label for="signup_dob">Date of Birth</label>
						<input type="date" class="form-control" id="signup_dob" name="date_of_birth">
					</div>
					<div class="form-group">
						<label for="signup_password">Password</label>
						<input type="password" class="form-control" id="signup_password" name="password" required>
					</div>
					<div class="form-group">
						<label for="signup_confirm_password">Confirm Password</label>
						<input type="password" class="form-control" id="signup_confirm_password" name="confirm_password" required>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
					<button type="submit" class="btn btn-primary">Sign Up</button>
				</div>
			</form>
			<div class="modal-body text-center" style="padding-top: 0;">
				<p>Already have an account? <a href="#" data-dismiss="modal" data-toggle="modal" data-target="#loginModal">Login here</a></p>
			</div>
		</div>
	</div>
</div>

<script src="{% static 'js/jquery.js' %}"></script>
<script src="{% static 'js/plugins.js' %}"></script>
<script src="{% static 'js/plugins2.js' %}"></script>
<script src="{% static 'js/custom.js' %}"></script>

</body>
</html>
